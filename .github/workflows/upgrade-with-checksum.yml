name: upgrade fsplayer (with checksum)

# 手动补发用：自动发布链路现在由 fsplayer 那边直接改 Package.swift 并推 commit
# （和 homebrew-aura 一样的做法），不再触发本 workflow。
# checksum 由源仓库算好后传进来 —— 不要在这里重新下载 zip 重算：刚发布的 release
# 在 CDN 上要过一会儿才一致，立刻下载可能拿不到。和 upgrade.yml（手动版）的区别仅此。
on:
  workflow_dispatch:
    inputs:
      version:
        description: fsplayer version
        required: true
      checksum:
        description: FSPlayer.zip checksum
        required: true

permissions:
  contents: write

jobs:
  build:
    name: upgrade-fsplayer-version
    runs-on: macos-14

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Update checksum
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        VERSION="${{ inputs.version }}"
        CHECKSUM="${{ inputs.checksum }}"
        url="https://github.com/debugly/fsplayer/releases/download/$VERSION/FSPlayer.zip"

        # -i.bak 而非 -i ''：runner 现在是 macOS，但这样在 Linux 上也能跑。
        sed -i.bak "s|^[[:space:]]*url:.*|            url: \"$url\",|g"  Package.swift
        sed -i.bak "s|checksum:.*|checksum: \"$CHECKSUM\"|g"           Package.swift
        rm -f Package.swift.bak

        # 幂等：已经指向这个版本就别再 commit/push，否则会因 nothing to commit 失败，
        # 也会去重推一个已存在的 tag。
        if git diff --quiet -- Package.swift; then
          echo "::notice::Package.swift already points at $VERSION, nothing to do"
          exit 0
        fi

        git config user.name  'github-actions[bot]'
        git config user.email 'github-actions[bot]@users.noreply.github.com'
        git add Package.swift
        git commit -m "Update version to $VERSION"
        git push origin main

        # tag 已存在就不要强推，避免把已发布的 tag 指到别处。
        if git rev-parse "refs/tags/$VERSION" >/dev/null 2>&1; then
          echo "::notice::tag $VERSION already exists, leaving it alone"
        else
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"
        fi
