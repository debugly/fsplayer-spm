name: upgrade fsplayer

# 手动补发用：给一个版本号，它自己下载 zip、算校验和、改 Package.swift、打 tag。
# 正常发布不需要它 —— 自动链路由 debugly/fsplayer 的 fsplayer-release.yml 直接用
# 部署密钥改 Package.swift 并推 commit（和 homebrew-aura 同一套做法）。
on:
  workflow_dispatch:
    inputs:
      version:
        description: fsplayer version
        required: true

permissions:
  contents: write

jobs:
  build:
    name: upgrade-fsplayer-version
    runs-on: macos-14

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Update checksum
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        VERSION="${{ inputs.version }}"
        url="https://github.com/debugly/fsplayer/releases/download/$VERSION/FSPlayer.zip"

        # 刚发布的 release 在 CDN 上要过一会儿才一致，第一次可能 404，
        # 所以重试几次；-f 让 404/5xx 变成失败而不是把错误页存成 zip。
        for attempt in 1 2 3 4 5; do
          if curl -fsSL -o FSPlayer.zip "$url"; then break; fi
          echo "::warning::下载失败（第 ${attempt} 次），10 秒后重试"
          sleep 10
        done
        [[ -s FSPlayer.zip ]] || { echo "::error::下载不到 $url"; exit 1; }
        sum=$(swift package compute-checksum FSPlayer.zip)

        sed -i.bak "s|^[[:space:]]*url:.*|            url: \"$url\",|g"  Package.swift
        sed -i.bak "s|checksum:.*|checksum: \"$sum\"|g"           Package.swift
        rm -f Package.swift.bak

        if git diff --quiet -- Package.swift; then
          echo "::notice::Package.swift already points at $VERSION, nothing to do"
          exit 0
        fi

        git config user.name  'github-actions[bot]'
        git config user.email 'github-actions[bot]@users.noreply.github.com'
        git add Package.swift
        git commit -m "Update version to $VERSION"
        git push origin main

        if git rev-parse "refs/tags/$VERSION" >/dev/null 2>&1; then
          echo "::notice::tag $VERSION already exists, leaving it alone"
        else
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"
        fi
