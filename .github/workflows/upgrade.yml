name: upgrade fsplayer

# 手动版本：自己下载 zip 并算校验和。自动发布链路走 upgrade-with-checksum.yml。
on:
  workflow_dispatch:
    inputs:
      version:
        description: fsplayer version
        required: true

permissions:
  contents: write

jobs:
  build:
    name: upgrade-fsplayer-version
    runs-on: macos-14

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Update checksum
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        VERSION="${{ inputs.version }}"
        url="https://github.com/debugly/fsplayer/releases/download/$VERSION/FSPlayer.zip"

        curl -LO "$url"
        sum=$(swift package compute-checksum FSPlayer.zip)

        sed -i.bak "s|^[[:space:]]*url:.*|            url: \"$url\",|g"  Package.swift
        sed -i.bak "s|checksum:.*|checksum: \"$sum\"|g"           Package.swift
        rm -f Package.swift.bak

        if git diff --quiet -- Package.swift; then
          echo "::notice::Package.swift already points at $VERSION, nothing to do"
          exit 0
        fi

        git config user.name  'github-actions[bot]'
        git config user.email 'github-actions[bot]@users.noreply.github.com'
        git add Package.swift
        git commit -m "Update version to $VERSION"
        git push origin main

        if git rev-parse "refs/tags/$VERSION" >/dev/null 2>&1; then
          echo "::notice::tag $VERSION already exists, leaving it alone"
        else
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"
        fi
